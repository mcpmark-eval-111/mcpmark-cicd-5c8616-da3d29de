name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: |
          set +e
          npm run lint > eslint-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "----- ESLint Output -----"
          cat eslint-output.txt || true

      - name: Run Prettier check
        id: prettier
        continue-on-error: true
        run: |
          set +e
          npx --yes prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}" > prettier-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "----- Prettier Output -----"
          cat prettier-output.txt || true

      - name: Post code quality PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 5000); }
              catch (e) { return '_no output captured_'; }
            };
            const eslintOutput = readSafe('eslint-output.txt');
            const prettierOutput = readSafe('prettier-output.txt');
            const eslintStatus = '${{ steps.eslint.outputs.exit_code }}' === '0' ? '✅ passed' : '⚠️ issues found';
            const prettierStatus = '${{ steps.prettier.outputs.exit_code }}' === '0' ? '✅ passed' : '⚠️ issues found';
            const cqBody = [
              '## 🧹 Code Quality Report',
              '',
              `- **ESLint**: ${eslintStatus}`,
              `- **Prettier**: ${prettierStatus}`,
              '',
              '<details><summary>ESLint output</summary>',
              '',
              '```',
              eslintOutput,
              '```',
              '</details>',
              '',
              '<details><summary>Prettier output</summary>',
              '',
              '```',
              prettierOutput,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: cqBody,
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run test suite
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test > test-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "----- Test Output -----"
          cat test-output.txt || true

      - name: Generate coverage report
        id: coverage
        continue-on-error: true
        run: |
          set +e
          mkdir -p coverage
          (npx --yes jest --coverage --coverageDirectory=coverage --passWithNoTests > coverage-output.txt 2>&1) \
            || (npm test -- --coverage > coverage-output.txt 2>&1) \
            || true
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "----- Coverage Output -----"
          cat coverage-output.txt || true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: |
            coverage/
            coverage-output.txt
            test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Post coverage PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 5000); }
              catch (e) { return '_no output captured_'; }
            };
            const testOutput = readSafe('test-output.txt');
            const coverageOutput = readSafe('coverage-output.txt');
            const testStatus = '${{ steps.tests.outputs.exit_code }}' === '0' ? '✅ passed' : '❌ failed';
            const tsBody = [
              '## 🧪 Test Coverage Report',
              '',
              `- **Tests**: ${testStatus}`,
              '- **Coverage artifact**: uploaded as `test-coverage-report`',
              '',
              '<details><summary>Test output</summary>',
              '',
              '```',
              testOutput,
              '```',
              '</details>',
              '',
              '<details><summary>Coverage summary</summary>',
              '',
              '```',
              coverageOutput,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: tsBody,
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run dependency vulnerability check (npm audit)
        id: audit
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=low > audit-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "----- npm audit Output -----"
          cat audit-output.txt || true

      - name: Scan PR diff for secrets
        id: secrets
        continue-on-error: true
        run: |
          set +e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch origin "$BASE_SHA" "$HEAD_SHA" || true
          git diff "$BASE_SHA" "$HEAD_SHA" > pr.diff 2>/dev/null || git diff HEAD~1 HEAD > pr.diff 2>/dev/null || true
          : > secrets-output.txt
          PATTERNS='(AKIA[0-9A-Z]{16})|(ASIA[0-9A-Z]{16})|(ghp_[A-Za-z0-9]{20,})|(gho_[A-Za-z0-9]{20,})|(github_pat_[A-Za-z0-9_]{20,})|(xox[baprs]-[A-Za-z0-9-]{10,})|(-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----)|((?i)(api[_-]?key|secret|token|password)\s*[:=]\s*["'\''][^"'\'' ]{8,}["'\''])'
          if [ -s pr.diff ]; then
            grep -E -n -i "$PATTERNS" pr.diff > secrets-output.txt 2>/dev/null || true
          fi
          if [ -s secrets-output.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No potential secrets detected in PR diff." > secrets-output.txt
          fi
          echo "----- Secret Scan Output -----"
          cat secrets-output.txt || true

      - name: Post security scan PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 5000); }
              catch (e) { return '_no output captured_'; }
            };
            const auditOutput = readSafe('audit-output.txt');
            const secretsOutput = readSafe('secrets-output.txt');
            const auditStatus = '${{ steps.audit.outputs.exit_code }}' === '0' ? '✅ no known issues' : '⚠️ issues found';
            const secretsFound = '${{ steps.secrets.outputs.found }}' === 'true';
            const secretsStatus = secretsFound ? '⚠️ potential secrets detected' : '✅ none detected';
            const ssBody = [
              '## 🔒 Security Scan Report',
              '',
              `- **Dependencies (npm audit)**: ${auditStatus}`,
              `- **Vulnerabilities scan**: see audit details below`,
              `- **Secret scan**: ${secretsStatus}`,
              '',
              '<details><summary>Dependency Vulnerabilities (npm audit)</summary>',
              '',
              '```',
              auditOutput,
              '```',
              '</details>',
              '',
              '<details><summary>Secret scan results</summary>',
              '',
              '```',
              secretsOutput,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ssBody,
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          set +e
          mkdir -p build-preview
          (npm run build > build-output.txt 2>&1) || echo "No build script or build failed; continuing." > build-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "----- Build Output -----"
          cat build-output.txt || true
          # Capture any build artifacts for preview
          if [ -d dist ]; then cp -r dist build-preview/dist; fi
          if [ -d build ]; then cp -r build build-preview/build; fi
          if [ -d public ]; then cp -r public build-preview/public; fi
          cp -r package.json build-preview/ 2>/dev/null || true

      - name: Validate endpoints
        id: endpoints
        continue-on-error: true
        run: |
          set +e
          : > endpoints-output.txt
          # Try starting the app in the background and probing common endpoints
          if [ -f server.js ] || [ -f index.js ] || [ -f app.js ]; then
            (npm start > server.log 2>&1 &) || true
            sleep 8
            for url in http://localhost:3000/ http://localhost:3000/health http://localhost:3000/api http://localhost:8080/; do
              echo "Probing $url" >> endpoints-output.txt
              curl -fsS --max-time 5 "$url" >> endpoints-output.txt 2>&1 || echo "  -> not reachable" >> endpoints-output.txt
              echo "" >> endpoints-output.txt
            done
            pkill -f "node" || true
          else
            echo "No server entrypoint detected; skipping endpoint validation." > endpoints-output.txt
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat endpoints-output.txt || true

      - name: Upload deployment preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: |
            build-preview/
            build-output.txt
            endpoints-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Post build validation PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 5000); }
              catch (e) { return '_no output captured_'; }
            };
            const buildOutput = readSafe('build-output.txt');
            const endpointsOutput = readSafe('endpoints-output.txt');
            const buildStatus = '${{ steps.build.outputs.exit_code }}' === '0' ? '✅ passed' : '⚠️ issues';
            const bvBody = [
              '## 🏗️ Build Validation',
              '',
              `- **Build**: ${buildStatus}`,
              '- **Deployment preview artifact**: uploaded as `deployment-preview`',
              '- **Endpoint accessibility**: see details below',
              '',
              '<details><summary>Build output</summary>',
              '',
              '```',
              buildOutput,
              '```',
              '</details>',
              '',
              '<details><summary>Endpoint validation</summary>',
              '',
              '```',
              endpointsOutput,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: bvBody,
            });
